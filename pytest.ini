[pytest]
pythonpath = .
testpaths = tests
markers =
    slow: embedding modeli ve vektör indeksi gerektiren testler
    llm: gerçek LLM API'sini çağıran testler (ücretli, API anahtarı gerekir)
# Varsayılan olarak sadece hızlı testler çalışır. Diğerleri için:
#   pytest -m slow     veya     pytest -m llm
addopts = -m "not slow and not llm"